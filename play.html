<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="paper.css">
    <link rel="stylesheet" href="play.css">
</head>
<body class="paper play">
<header class="bar">
    <a class="up pill home-link" href="index.html" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3.5 11.2 12 3.8l8.5 7.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.8 10v9.2h4.6v-5.4h3.2v5.4h4.6V10L12 5.2z" fill="currentColor"/></svg></a>
    <h1 id="page-title" class="title"></h1>
    <div class="dots-menu-wrap">
        <button id="dots-menu-button" class="speed-button" data-tip="Dots" aria-label="Dots" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 16" width="24" height="14" aria-hidden="true"><circle cx="5" cy="9.5" r="2.1" fill="currentColor"/><circle cx="11" cy="9.5" r="2.1" fill="currentColor"/><circle cx="8" cy="5" r="2.1" fill="currentColor"/><path d="M16.5 6.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="dots-menu" class="dots-menu up" role="menu" aria-label="Dots" hidden>
            <button role="menuitemradio" data-mode="skips" aria-checked="true">Some dots</button>
            <button role="menuitemradio" data-mode="all" aria-checked="false">All dots</button>
            <button role="menuitemradio" data-mode="none" aria-checked="false">No dots</button>
        </div>
    </div>
    <button id="help-button" class="up pill help-button" data-tip="How to play" aria-label="How to play"><span>?</span></button>
    <button id="burger-button" class="up pill burger-button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="burger-pop"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path class="bb-top" d="M4 7h16"/><path class="bb-mid" d="M4 12h16"/><path class="bb-bot" d="M4 17h16"/></svg></button>
    <div class="burger-tray"><div id="burger-pop" class="burger-pop" data-open="false">
        <span class="burger-link" aria-hidden="true"></span>
        <button id="burger-help" class="burger-item" aria-label="How to play"><span>?</span></button>
        <span class="burger-link" aria-hidden="true"></span>
    </div></div>
</header>
<div id="game-container">
    <div id="canvas-container">
        <div id="info-row"></div>
        <div class="screen"><canvas id="canvas" width="400" height="400">Error</canvas></div>
        <div id="board-tools"></div>
        <div id="nav-controls" role="group" aria-label="Change puzzle">
            <button id="back-button" class="nav-button">&lsaquo; Back</button>
            <div id="hand-controls">
                <button id="clear-button" class="nav-button icon-button" data-tip="Clear board" aria-label="Clear board">
                    <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true"><path d="M11.4 3.6l5 5-7 7H5.2l-2.4-2.4a1.6 1.6 0 0 1 0-2.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.6 7.4l5 5M9 16.6h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div id="forward-controls">
                <button id="next-button" class="nav-button">Next &rsaquo;</button>
                <button id="new-button" class="nav-button" hidden></button>
            </div>
        </div>
        <div id="hand-row"><div id="pool"></div></div>
    </div>
    <div id="side-panel">
        <div id="summary-box" class="up box"><div id="summary-panel">Hover a piece for details.</div></div>
        <div id="result-banner" class="up box hidden"><span id="result-text"></span><button id="result-share" class="up pill share-button" data-tip="Share" aria-label="Share your result" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 15V3.5M7.8 7.6 12 3.4l4.2 4.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 10.5H6.4a1.4 1.4 0 0 0-1.4 1.4v7.2a1.4 1.4 0 0 0 1.4 1.4h11.2a1.4 1.4 0 0 0 1.4-1.4v-7.2a1.4 1.4 0 0 0-1.4-1.4h-2.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        <div id="controls">
            <button id="retry-button" class="up btn" hidden><span>Try again</span></button>
            <button id="run-button" class="up btn fill" data-label="Run"><svg class="play-icon" viewBox="0 0 16 16" width="26" height="26" aria-hidden="true"><path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8A.8.8 0 0 0 4 2.2z" fill="currentColor"/></svg><span id="run-label">Run</span></button>
            <button id="solution-button">Show Solution</button>
        </div>
        <div id="view-controls" role="group" aria-label="Help, animation speed and display">
            <button class="speed-button" data-speed="0.5" data-tip="Slow" aria-label="Slow speed">
                <svg viewBox="0 0 20 16" width="20" height="14" aria-hidden="true"><path d="M2.5 11.5C2.5 6.5 5.5 4 8.5 4s6 2.5 6 7.5z" fill="currentColor"/><circle cx="16.8" cy="8.6" r="2" fill="currentColor"/><path d="M5 11.5v2.4M12 11.5v2.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <button class="speed-button selected" data-speed="1.2" data-tip="Normal" aria-label="Normal speed">
                <svg viewBox="0 0 16 16" width="16" height="14" aria-hidden="true"><path d="M2 12.5a6 6 0 1 1 12 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M8 12.5V6.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="8" cy="12.5" r="1.7" fill="currentColor"/></svg>
            </button>
            <button class="speed-button" data-speed="1000" data-tip="Instant" aria-label="Instant">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.5 1L3 9h4l-1 6 7-9H9z" fill="currentColor" stroke="currentColor" stroke-width="0.6" stroke-linejoin="round"/></svg>
            </button>
        </div>
        <div id="ways-wrap" hidden><div id="ways-box" class="up box"><div id="ways"></div></div><button id="share-button" class="up pill share-button" data-tip="Share" aria-label="Share your result"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 15V3.5M7.8 7.6 12 3.4l4.2 4.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 10.5H6.4a1.4 1.4 0 0 0-1.4 1.4v7.2a1.4 1.4 0 0 0 1.4 1.4h11.2a1.4 1.4 0 0 0 1.4-1.4v-7.2a1.4 1.4 0 0 0-1.4-1.4h-2.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>
</div>

<div id="tutorial" class="tutorial-overlay" hidden>
    <div class="tutorial-card up" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
        <div class="tutorial-head">
            <h2 id="tutorial-title"></h2>
            <button id="tutorial-close" class="up pill tutorial-close" aria-label="Close"><span>&times;</span></button>
        </div>
        <p id="tutorial-hint" aria-live="polite"><span></span></p>
        <div class="screen tutorial-screen"><canvas id="tutorial-canvas" width="320" height="320" aria-label="Tutorial board"></canvas></div>
        <div id="tutorial-hand" aria-label="Your hand"></div>
        <div class="tutorial-actions">
            <button id="tutorial-hint-button" class="up pill"><span>Hint</span></button>
            <button id="tutorial-run" class="up btn fill"><span id="tutorial-run-label">Run</span></button>
        </div>
        <div class="tutorial-footer">
            <button id="tutorial-back" class="up pill tutorial-arrow" aria-label="Back" data-tip="Back"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div id="tutorial-dots" aria-hidden="true"></div>
            <button id="tutorial-next" class="up pill tutorial-arrow" aria-label="Next" data-tip="Next"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
    </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
